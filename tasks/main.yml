---
# tasks/main.yml - Main tasks for execution-result-update-db role

- name: Execute database update operations on localhost
  block:
    - name: Debug - Show role execution start
      ansible.builtin.debug:
        msg: "Starting execution-result-update-db role"
      when: execution_result_debug_mode | bool

    - name: Validate database type
      ansible.builtin.assert:
        that:
          - execution_result_db_type in ['postgresql', 'mysql', 'sqlite', 'mongodb']
        fail_msg: "Invalid database type: {{ execution_result_db_type }}. Must be one of: postgresql, mysql, sqlite, mongodb"
        success_msg: "Database type validated: {{ execution_result_db_type }}"

    - name: Check if required Ansible collection is installed
      ansible.builtin.command: ansible-galaxy collection list {{ _required_collection }}
      register: _collection_check
      changed_when: false
      failed_when: false
      vars:
        _required_collection: "{{ _execution_result_collection_map[execution_result_db_type] }}"
      when: execution_result_db_type in _execution_result_collection_map

    - name: Install required Ansible collection if missing
      ansible.builtin.command: ansible-galaxy collection install {{ _required_collection }} --force
      vars:
        _required_collection: "{{ _execution_result_collection_map[execution_result_db_type] }}"
      when:
        - execution_result_db_type in _execution_result_collection_map
        - _collection_check.rc != 0 or _required_collection not in _collection_check.stdout
      register: _collection_install
      changed_when: "'installed' in _collection_install.stdout or 'downloaded' in _collection_install.stdout"

    - name: Debug - Show collection installation result
      ansible.builtin.debug:
        msg: "Collection {{ _execution_result_collection_map[execution_result_db_type] }} {{ 'installed successfully' if _collection_install is changed else 'already installed' }}"
      when:
        - execution_result_debug_mode | bool
        - execution_result_db_type in _execution_result_collection_map

    - name: Include prerequisite tasks
      ansible.builtin.include_tasks: prerequisites.yml

    - name: Include artifact capture tasks
      ansible.builtin.include_tasks: capture_artifacts.yml

    - name: Include data preparation tasks
      ansible.builtin.include_tasks: prepare_data.yml

    - name: Include database-specific tasks
      ansible.builtin.include_tasks: "database_{{ execution_result_db_type }}.yml"

    - name: Debug - Show role execution complete
      ansible.builtin.debug:
        msg: "Completed execution-result-update-db role - {{ _execution_result_records_processed | default(0) }} records processed"
      when: execution_result_debug_mode | bool
  delegate_to: localhost
