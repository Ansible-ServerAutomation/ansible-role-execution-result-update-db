---
# tasks/database_sqlite.yml - SQLite specific tasks

- name: Skip SQLite tasks if no prepared records
  ansible.builtin.meta: end_host
  when: _execution_results_prepared | length == 0

- name: Ensure SQLite database directory exists
  ansible.builtin.file:
    path: "{{ execution_result_db_sqlite_path | dirname }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  run_once: true

- name: Create success_jobs table in SQLite
  community.general.sqlite3:
    db: "{{ execution_result_db_sqlite_path }}"
    query: |
      CREATE TABLE IF NOT EXISTS {{ execution_result_db_table_success }} (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        timestamp TEXT NOT NULL,
        hostname TEXT,
        inventory_hostname TEXT,
        ansible_host TEXT,
        project TEXT,
        organization TEXT,
        job_template TEXT,
        playbook TEXT,
        scm_url TEXT,
        scm_branch TEXT,
        scm_revision TEXT,
        execution_environment TEXT,
        status TEXT NOT NULL,
        return_code INTEGER,
        message TEXT,
        stdout TEXT,
        stderr TEXT,
        exception TEXT,
        warnings TEXT,
        failed_task TEXT,
        failed_task_module TEXT,
        os_distribution TEXT,
        os_version TEXT,
        os_family TEXT,
        os_system TEXT,
        os_architecture TEXT,
        created_at TEXT DEFAULT CURRENT_TIMESTAMP,
        updated_at TEXT DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS idx_{{ execution_result_db_table_success }}_timestamp ON {{ execution_result_db_table_success }}(timestamp);
      CREATE INDEX IF NOT EXISTS idx_{{ execution_result_db_table_success }}_project ON {{ execution_result_db_table_success }}(project);
      CREATE INDEX IF NOT EXISTS idx_{{ execution_result_db_table_success }}_playbook ON {{ execution_result_db_table_success }}(playbook);
  delegate_to: localhost
  run_once: true
  ignore_errors: "{{ not execution_result_fail_on_db_error }}"

- name: Create failed_jobs table in SQLite
  community.general.sqlite3:
    db: "{{ execution_result_db_sqlite_path }}"
    query: |
      CREATE TABLE IF NOT EXISTS {{ execution_result_db_table_failed }} (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        timestamp TEXT NOT NULL,
        hostname TEXT,
        inventory_hostname TEXT,
        ansible_host TEXT,
        project TEXT,
        organization TEXT,
        job_template TEXT,
        playbook TEXT,
        scm_url TEXT,
        scm_branch TEXT,
        scm_revision TEXT,
        execution_environment TEXT,
        status TEXT NOT NULL,
        return_code INTEGER,
        message TEXT,
        stdout TEXT,
        stderr TEXT,
        exception TEXT,
        warnings TEXT,
        failed_task TEXT,
        failed_task_module TEXT,
        os_distribution TEXT,
        os_version TEXT,
        os_family TEXT,
        os_system TEXT,
        os_architecture TEXT,
        created_at TEXT DEFAULT CURRENT_TIMESTAMP,
        updated_at TEXT DEFAULT CURRENT_TIMESTAMP
      );
      CREATE INDEX IF NOT EXISTS idx_{{ execution_result_db_table_failed }}_timestamp ON {{ execution_result_db_table_failed }}(timestamp);
      CREATE INDEX IF NOT EXISTS idx_{{ execution_result_db_table_failed }}_project ON {{ execution_result_db_table_failed }}(project);
      CREATE INDEX IF NOT EXISTS idx_{{ execution_result_db_table_failed }}_failed_task ON {{ execution_result_db_table_failed }}(failed_task);
  delegate_to: localhost
  run_once: true
  ignore_errors: "{{ not execution_result_fail_on_db_error }}"

- name: Insert successful execution results into SQLite
  block:
    - name: Insert success records
      community.general.sqlite3:
        db: "{{ execution_result_db_sqlite_path }}"
        query: |
          INSERT INTO {{ execution_result_db_table_success }} (
            timestamp, hostname, inventory_hostname, ansible_host,
            project, organization, job_template, playbook,
            scm_url, scm_branch, scm_revision, execution_environment,
            status, return_code, message, stdout, stderr, exception,
            warnings, failed_task, failed_task_module,
            os_distribution, os_version, os_family, os_system, os_architecture
          ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
        params:
          - "{{ item.timestamp }}"
          - "{{ item.hostname }}"
          - "{{ item.inventory_hostname }}"
          - "{{ item.ansible_host }}"
          - "{{ item.project }}"
          - "{{ item.organization }}"
          - "{{ item.job_template }}"
          - "{{ item.playbook }}"
          - "{{ item.scm_url }}"
          - "{{ item.scm_branch }}"
          - "{{ item.scm_revision }}"
          - "{{ item.execution_environment }}"
          - "{{ item.status }}"
          - "{{ item.return_code }}"
          - "{{ item.message }}"
          - "{{ item.stdout }}"
          - "{{ item.stderr }}"
          - "{{ item.exception }}"
          - "{{ item.warnings | to_json }}"
          - "{{ item.failed_task }}"
          - "{{ item.failed_task_module }}"
          - "{{ item.os_distribution }}"
          - "{{ item.os_version }}"
          - "{{ item.os_family }}"
          - "{{ item.os_system }}"
          - "{{ item.os_architecture }}"
      loop: "{{ _execution_results_success }}"
      loop_control:
        label: "{{ item.timestamp }} - {{ item.status }}"
      delegate_to: localhost
      register: _insert_success_result
      ignore_errors: "{{ not execution_result_fail_on_db_error }}"
  when: _execution_results_success | length > 0

- name: Insert failed execution results into SQLite
  block:
    - name: Insert failed records
      community.general.sqlite3:
        db: "{{ execution_result_db_sqlite_path }}"
        query: |
          INSERT INTO {{ execution_result_db_table_failed }} (
            timestamp, hostname, inventory_hostname, ansible_host,
            project, organization, job_template, playbook,
            scm_url, scm_branch, scm_revision, execution_environment,
            status, return_code, message, stdout, stderr, exception,
            warnings, failed_task, failed_task_module,
            os_distribution, os_version, os_family, os_system, os_architecture
          ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
        params:
          - "{{ item.timestamp }}"
          - "{{ item.hostname }}"
          - "{{ item.inventory_hostname }}"
          - "{{ item.ansible_host }}"
          - "{{ item.project }}"
          - "{{ item.organization }}"
          - "{{ item.job_template }}"
          - "{{ item.playbook }}"
          - "{{ item.scm_url }}"
          - "{{ item.scm_branch }}"
          - "{{ item.scm_revision }}"
          - "{{ item.execution_environment }}"
          - "{{ item.status }}"
          - "{{ item.return_code }}"
          - "{{ item.message }}"
          - "{{ item.stdout }}"
          - "{{ item.stderr }}"
          - "{{ item.exception }}"
          - "{{ item.warnings | to_json }}"
          - "{{ item.failed_task }}"
          - "{{ item.failed_task_module }}"
          - "{{ item.os_distribution }}"
          - "{{ item.os_version }}"
          - "{{ item.os_family }}"
          - "{{ item.os_system }}"
          - "{{ item.os_architecture }}"
      loop: "{{ _execution_results_failed }}"
      loop_control:
        label: "{{ item.timestamp }} - {{ item.status }}"
      delegate_to: localhost
      register: _insert_failed_result
      ignore_errors: "{{ not execution_result_fail_on_db_error }}"
  when: _execution_results_failed | length > 0

- name: Set records processed count
  ansible.builtin.set_fact:
    _execution_result_records_processed: "{{ (_execution_results_success | length) + (_execution_results_failed | length) }}"

- name: Debug - Show insert results
  ansible.builtin.debug:
    msg: "Successfully inserted {{ _execution_results_success | length }} success record(s) and {{ _execution_results_failed | length }} failed record(s) into SQLite"
  when:
    - execution_result_debug_mode | bool
    - _execution_result_records_processed | int > 0
