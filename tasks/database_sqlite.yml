---
# tasks/database_sqlite.yml - SQLite specific tasks

- name: Execute SQLite database operations on localhost
  block:
    - name: Skip SQLite tasks if no prepared records
      ansible.builtin.meta: end_host
      when: _execution_results_prepared | length == 0

    - name: Verify SQLite database file exists
      ansible.builtin.stat:
        path: "{{ execution_result_db_sqlite_path }}"
      register: _sqlite_db_file
      run_once: true

    - name: Fail if SQLite database file does not exist
      ansible.builtin.fail:
        msg: "SQLite database file '{{ execution_result_db_sqlite_path }}' does not exist. Please create it before using this role."
      when: not _sqlite_db_file.stat.exists
      run_once: true

    - name: Verify success_jobs table exists
      community.general.sqlite3:
        db: "{{ execution_result_db_sqlite_path }}"
        query: "SELECT name FROM sqlite_master WHERE type='table' AND name=?;"
        args:
          - "{{ execution_result_db_table_success }}"
      register: _success_table_check
      run_once: true

    - name: Fail if success_jobs table does not exist
      ansible.builtin.fail:
        msg: "Table '{{ execution_result_db_table_success }}' does not exist in SQLite database '{{ execution_result_db_sqlite_path }}'. Please create it before using this role."
      when: _success_table_check.query_result | length == 0
      run_once: true

    - name: Verify failed_jobs table exists
      community.general.sqlite3:
        db: "{{ execution_result_db_sqlite_path }}"
        query: "SELECT name FROM sqlite_master WHERE type='table' AND name=?;"
        args:
          - "{{ execution_result_db_table_failed }}"
      register: _failed_table_check
      run_once: true

    - name: Fail if failed_jobs table does not exist
      ansible.builtin.fail:
        msg: "Table '{{ execution_result_db_table_failed }}' does not exist in SQLite database '{{ execution_result_db_sqlite_path }}'. Please create it before using this role."
      when: _failed_table_check.query_result | length == 0
      run_once: true

    - name: Insert success records
      community.general.sqlite3:
        db: "{{ execution_result_db_sqlite_path }}"
        query: |
          INSERT INTO {{ execution_result_db_table_success }} (
            timestamp, hostname, inventory_hostname, ansible_host,
            project, organization, job_template, playbook,
            scm_url, scm_branch, scm_revision, execution_environment,
            status, return_code, message, stdout, stderr, exception,
            warnings, failed_task, failed_task_module,
            os_distribution, os_version, os_family, os_system, os_architecture
          ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
        params:
          - "{{ item.timestamp }}"
          - "{{ item.hostname }}"
          - "{{ item.inventory_hostname }}"
          - "{{ item.ansible_host }}"
          - "{{ item.project }}"
          - "{{ item.organization }}"
          - "{{ item.job_template }}"
          - "{{ item.playbook }}"
          - "{{ item.scm_url }}"
          - "{{ item.scm_branch }}"
          - "{{ item.scm_revision }}"
          - "{{ item.execution_environment }}"
          - "{{ item.status }}"
          - "{{ item.return_code }}"
          - "{{ item.message }}"
          - "{{ item.stdout }}"
          - "{{ item.stderr }}"
          - "{{ item.exception }}"
          - "{{ item.warnings | to_json }}"
          - "{{ item.failed_task }}"
          - "{{ item.failed_task_module }}"
          - "{{ item.os_distribution }}"
          - "{{ item.os_version }}"
          - "{{ item.os_family }}"
          - "{{ item.os_system }}"
          - "{{ item.os_architecture }}"
      loop: "{{ _execution_results_success }}"
      loop_control:
        label: "{{ item.timestamp }} - {{ item.status }}"
      register: _insert_success_result
      ignore_errors: "{{ not execution_result_fail_on_db_error }}"
      when: _execution_results_success | length > 0

    - name: Insert failed records
      community.general.sqlite3:
        db: "{{ execution_result_db_sqlite_path }}"
        query: |
          INSERT INTO {{ execution_result_db_table_failed }} (
            timestamp, hostname, inventory_hostname, ansible_host,
            project, organization, job_template, playbook,
            scm_url, scm_branch, scm_revision, execution_environment,
            status, return_code, message, stdout, stderr, exception,
            warnings, failed_task, failed_task_module,
            os_distribution, os_version, os_family, os_system, os_architecture
          ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
        params:
          - "{{ item.timestamp }}"
          - "{{ item.hostname }}"
          - "{{ item.inventory_hostname }}"
          - "{{ item.ansible_host }}"
          - "{{ item.project }}"
          - "{{ item.organization }}"
          - "{{ item.job_template }}"
          - "{{ item.playbook }}"
          - "{{ item.scm_url }}"
          - "{{ item.scm_branch }}"
          - "{{ item.scm_revision }}"
          - "{{ item.execution_environment }}"
          - "{{ item.status }}"
          - "{{ item.return_code }}"
          - "{{ item.message }}"
          - "{{ item.stdout }}"
          - "{{ item.stderr }}"
          - "{{ item.exception }}"
          - "{{ item.warnings | to_json }}"
          - "{{ item.failed_task }}"
          - "{{ item.failed_task_module }}"
          - "{{ item.os_distribution }}"
          - "{{ item.os_version }}"
          - "{{ item.os_family }}"
          - "{{ item.os_system }}"
          - "{{ item.os_architecture }}"
      loop: "{{ _execution_results_failed }}"
      loop_control:
        label: "{{ item.timestamp }} - {{ item.status }}"
      register: _insert_failed_result
      ignore_errors: "{{ not execution_result_fail_on_db_error }}"
      when: _execution_results_failed | length > 0

    - name: Set records processed count
      ansible.builtin.set_fact:
        _execution_result_records_processed: "{{ (_execution_results_success | length) + (_execution_results_failed | length) }}"

    - name: Debug - Show insert results
      ansible.builtin.debug:
        msg: "Successfully inserted {{ _execution_results_success | length }} success record(s) and {{ _execution_results_failed | length }} failed record(s) into SQLite"
      when:
        - execution_result_debug_mode | bool
        - _execution_result_records_processed | int > 0
  delegate_to: localhost
