---
# tasks/database_mongodb.yml - MongoDB specific tasks

- name: Execute MongoDB database operations on localhost
  block:
    - name: Skip MongoDB tasks if no prepared records
      ansible.builtin.meta: end_host
      when: _execution_results_prepared | length == 0

    - name: Debug - Show database connection details
      ansible.builtin.debug:
        msg:
          - "Connecting to MongoDB database"
          - "Host: {{ execution_result_db_host }}"
          - "Port: {{ execution_result_db_port }}"
          - "Database: {{ execution_result_db_name }}"
          - "User: {{ execution_result_db_user }}"
          - "Password: {{ 'Provided' if execution_result_db_password else 'Not provided' }}"
          - "Collections: {{ execution_result_db_mongodb_collection_success }}, {{ execution_result_db_mongodb_collection_failed }}"
          - "Auth Source: {{ execution_result_db_mongodb_auth_source }}"
      when: execution_result_debug_mode | bool

    - name: Verify MongoDB database exists
      community.mongodb.mongodb_shell:
        connection_string: "mongodb://{{ execution_result_db_user }}:{{ execution_result_db_password }}@{{ execution_result_db_host }}:{{ execution_result_db_port }}/{{ execution_result_db_name }}?authSource={{ execution_result_db_mongodb_auth_source }}"
        eval: "db.getMongo().getDBNames()"
      register: _mongodb_databases
      run_once: true

    - name: Fail if MongoDB database does not exist
      ansible.builtin.fail:
        msg: "Database '{{ execution_result_db_name }}' does not exist in MongoDB. Please create it before using this role."
      when: execution_result_db_name not in (_mongodb_databases.transformed_output | default([]))
      run_once: true

    - name: Verify success_jobs collection exists
      community.mongodb.mongodb_shell:
        connection_string: "mongodb://{{ execution_result_db_user }}:{{ execution_result_db_password }}@{{ execution_result_db_host }}:{{ execution_result_db_port }}/{{ execution_result_db_name }}?authSource={{ execution_result_db_mongodb_auth_source }}"
        eval: "db.getCollectionNames()"
      register: _mongodb_collections
      run_once: true

    - name: Fail if success_jobs collection does not exist
      ansible.builtin.fail:
        msg: "Collection '{{ execution_result_db_mongodb_collection_success }}' does not exist in MongoDB database '{{ execution_result_db_name }}'. Please create it before using this role."
      when: execution_result_db_mongodb_collection_success not in (_mongodb_collections.transformed_output | default([]))
      run_once: true

    - name: Fail if failed_jobs collection does not exist
      ansible.builtin.fail:
        msg: "Collection '{{ execution_result_db_mongodb_collection_failed }}' does not exist in MongoDB database '{{ execution_result_db_name }}'. Please create it before using this role."
      when: execution_result_db_mongodb_collection_failed not in (_mongodb_collections.transformed_output | default([]))
      run_once: true

    - name: Insert success records into MongoDB collection
      community.mongodb.mongodb_insert:
        name: "{{ execution_result_db_name }}"
        collection: "{{ execution_result_db_mongodb_collection_success }}"
        connection_string: "mongodb://{{ execution_result_db_user }}:{{ execution_result_db_password }}@{{ execution_result_db_host }}:{{ execution_result_db_port }}/{{ execution_result_db_name }}?authSource={{ execution_result_db_mongodb_auth_source }}"
        records: "{{ _execution_results_success }}"
      run_once: true
      register: _insert_success_result
      ignore_errors: "{{ not execution_result_fail_on_db_error }}"
      when: _execution_results_success | length > 0

    - name: Insert failed records into MongoDB collection
      community.mongodb.mongodb_insert:
        name: "{{ execution_result_db_name }}"
        collection: "{{ execution_result_db_mongodb_collection_failed }}"
        connection_string: "mongodb://{{ execution_result_db_user }}:{{ execution_result_db_password }}@{{ execution_result_db_host }}:{{ execution_result_db_port }}/{{ execution_result_db_name }}?authSource={{ execution_result_db_mongodb_auth_source }}"
        records: "{{ _execution_results_failed }}"
      run_once: true
      register: _insert_failed_result
      ignore_errors: "{{ not execution_result_fail_on_db_error }}"
      when: _execution_results_failed | length > 0

    - name: Set records processed count
      ansible.builtin.set_fact:
        _execution_result_records_processed: "{{ (_execution_results_success | length) + (_execution_results_failed | length) }}"

    - name: Debug - Show insert results
      ansible.builtin.debug:
        msg: "Successfully inserted {{ _execution_results_success | length }} success record(s) and {{ _execution_results_failed | length }} failed record(s) into MongoDB"
      when:
        - execution_result_debug_mode | bool
        - _execution_result_records_processed | int > 0
  delegate_to: localhost
