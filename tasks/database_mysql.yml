---
# tasks/database_mysql.yml - MySQL specific tasks

- name: Skip MySQL tasks if no prepared records
  ansible.builtin.meta: end_host
  when: _execution_results_prepared | length == 0

- name: Debug - Show database connection details
  ansible.builtin.debug:
    msg:
      - "Connecting to MySQL database"
      - "Host: {{ execution_result_db_host }}"
      - "Port: {{ execution_result_db_port }}"
      - "Database: {{ execution_result_db_name }}"
      - "User: {{ execution_result_db_user }}"
      - "Password: {{ 'Provided' if execution_result_db_password else 'Not provided' }}"
      - "Tables: {{ execution_result_db_table_success }}, {{ execution_result_db_table_failed }}"
  when: execution_result_debug_mode | bool

- name: Create database if it doesn't exist
  community.mysql.mysql_db:
    login_host: "{{ execution_result_db_host }}"
    login_port: "{{ execution_result_db_port }}"
    login_user: "{{ execution_result_db_user }}"
    login_password: "{{ execution_result_db_password }}"
    name: "{{ execution_result_db_name }}"
    state: present
  delegate_to: localhost
  run_once: true
  ignore_errors: "{{ not execution_result_fail_on_db_error }}"

- name: Create success_jobs table
  community.mysql.mysql_query:
    login_host: "{{ execution_result_db_host }}"
    login_port: "{{ execution_result_db_port }}"
    login_user: "{{ execution_result_db_user }}"
    login_password: "{{ execution_result_db_password }}"
    login_db: "{{ execution_result_db_name }}"
    query: "{{ _execution_result_db_create_success_table_sql.mysql }}"
  delegate_to: localhost
  run_once: true
  ignore_errors: "{{ not execution_result_fail_on_db_error }}"

- name: Create failed_jobs table
  community.mysql.mysql_query:
    login_host: "{{ execution_result_db_host }}"
    login_port: "{{ execution_result_db_port }}"
    login_user: "{{ execution_result_db_user }}"
    login_password: "{{ execution_result_db_password }}"
    login_db: "{{ execution_result_db_name }}"
    query: "{{ _execution_result_db_create_failed_table_sql.mysql }}"
  delegate_to: localhost
  run_once: true
  ignore_errors: "{{ not execution_result_fail_on_db_error }}"

- name: Insert successful execution results into MySQL
  block:
    - name: Insert success records
      community.mysql.mysql_query:
        login_host: "{{ execution_result_db_host }}"
        login_port: "{{ execution_result_db_port }}"
        login_user: "{{ execution_result_db_user }}"
        login_password: "{{ execution_result_db_password }}"
        login_db: "{{ execution_result_db_name }}"
        query: |
          INSERT INTO {{ execution_result_db_table_success }} (
            timestamp, hostname, inventory_hostname, ansible_host,
            project, organization, job_template, playbook,
            scm_url, scm_branch, scm_revision, execution_environment,
            status, return_code, message, stdout, stderr, exception,
            warnings, failed_task, failed_task_module,
            os_distribution, os_version, os_family, os_system, os_architecture
          ) VALUES (
            %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s
          )
        positional_args:
          - "{{ item.timestamp }}"
          - "{{ item.hostname }}"
          - "{{ item.inventory_hostname }}"
          - "{{ item.ansible_host }}"
          - "{{ item.project }}"
          - "{{ item.organization }}"
          - "{{ item.job_template }}"
          - "{{ item.playbook }}"
          - "{{ item.scm_url }}"
          - "{{ item.scm_branch }}"
          - "{{ item.scm_revision }}"
          - "{{ item.execution_environment }}"
          - "{{ item.status }}"
          - "{{ item.return_code }}"
          - "{{ item.message }}"
          - "{{ item.stdout }}"
          - "{{ item.stderr }}"
          - "{{ item.exception }}"
          - "{{ item.warnings | to_json }}"
          - "{{ item.failed_task }}"
          - "{{ item.failed_task_module }}"
          - "{{ item.os_distribution }}"
          - "{{ item.os_version }}"
          - "{{ item.os_family }}"
          - "{{ item.os_system }}"
          - "{{ item.os_architecture }}"
      loop: "{{ _execution_results_success }}"
      loop_control:
        label: "{{ item.timestamp }} - {{ item.status }}"
      delegate_to: localhost
      register: _insert_success_result
      ignore_errors: "{{ not execution_result_fail_on_db_error }}"
  when:
    - execution_result_batch_insert | bool
    - _execution_results_success | length > 0

- name: Insert failed execution results into MySQL
  block:
    - name: Insert failed records
      community.mysql.mysql_query:
        login_host: "{{ execution_result_db_host }}"
        login_port: "{{ execution_result_db_port }}"
        login_user: "{{ execution_result_db_user }}"
        login_password: "{{ execution_result_db_password }}"
        login_db: "{{ execution_result_db_name }}"
        query: |
          INSERT INTO {{ execution_result_db_table_failed }} (
            timestamp, hostname, inventory_hostname, ansible_host,
            project, organization, job_template, playbook,
            scm_url, scm_branch, scm_revision, execution_environment,
            status, return_code, message, stdout, stderr, exception,
            warnings, failed_task, failed_task_module,
            os_distribution, os_version, os_family, os_system, os_architecture
          ) VALUES (
            %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s
          )
        positional_args:
          - "{{ item.timestamp }}"
          - "{{ item.hostname }}"
          - "{{ item.inventory_hostname }}"
          - "{{ item.ansible_host }}"
          - "{{ item.project }}"
          - "{{ item.organization }}"
          - "{{ item.job_template }}"
          - "{{ item.playbook }}"
          - "{{ item.scm_url }}"
          - "{{ item.scm_branch }}"
          - "{{ item.scm_revision }}"
          - "{{ item.execution_environment }}"
          - "{{ item.status }}"
          - "{{ item.return_code }}"
          - "{{ item.message }}"
          - "{{ item.stdout }}"
          - "{{ item.stderr }}"
          - "{{ item.exception }}"
          - "{{ item.warnings | to_json }}"
          - "{{ item.failed_task }}"
          - "{{ item.failed_task_module }}"
          - "{{ item.os_distribution }}"
          - "{{ item.os_version }}"
          - "{{ item.os_family }}"
          - "{{ item.os_system }}"
          - "{{ item.os_architecture }}"
      loop: "{{ _execution_results_failed }}"
      loop_control:
        label: "{{ item.timestamp }} - {{ item.status }}"
      delegate_to: localhost
      register: _insert_failed_result
      ignore_errors: "{{ not execution_result_fail_on_db_error }}"
  when:
    - execution_result_batch_insert | bool
    - _execution_results_failed | length > 0

- name: Set records processed count
  ansible.builtin.set_fact:
    _execution_result_records_processed: "{{ (_execution_results_success | length) + (_execution_results_failed | length) }}"

- name: Debug - Show insert results
  ansible.builtin.debug:
    msg: "Successfully inserted {{ _execution_results_success | length }} success record(s) and {{ _execution_results_failed | length }} failed record(s) into MySQL"
  when:
    - execution_result_debug_mode | bool
    - _execution_result_records_processed | int > 0
